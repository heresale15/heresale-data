<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="내 위치 주변 매장에서 내가 가진 카드·통신사 멤버십으로 받을 수 있는 할인을 정리해 주는 앱" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="여긴할인" />
  <title>여긴할인 — 내 주변 카드·통신사 할인</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="row1">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><line x1="18" y1="46" x2="46" y2="18" stroke="#fff" stroke-width="5"/><circle cx="22" cy="22" r="6" fill="none" stroke="#10b981" stroke-width="4.5"/><circle cx="42" cy="42" r="6" fill="none" stroke="#fcd34d" stroke-width="4.5"/></svg>
        </span>
        여긴할인
      </div>
      <button class="bigbtn" type="button" data-act="bigtext" aria-label="큰 글씨로 보기">가<small>+</small></button>
      <button class="loc-btn" id="locBtn" type="button" aria-label="기준 위치">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span class="t" id="locLabel">위치를 정해 주세요</span>
      </button>
    </div>
    <form class="searchbar" id="searchForm" autocomplete="off">
      <label class="box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="동네·역·매장 검색 (예: 서면역)" aria-label="검색" />
      </label>
      <button class="gps" id="gpsBtn" type="button" aria-label="내 위치로 찾기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </form>
    <div class="chips" id="catChips" role="tablist"></div>
  </header>

  <main id="main">
    <!-- 주변 매장 목록 -->
    <section class="view on" id="viewList">
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span class="txt" id="statusText">위치를 정하면 주변 매장을 찾아 드려요.</span>
        <select id="radiusSel" aria-label="검색 반경">
          <option value="500">500m</option>
          <option value="1000" selected>1km</option>
          <option value="2000">2km</option>
        </select>
      </div>
      <div class="list" id="storeList"></div>
    </section>

    <!-- 지도 -->
    <section class="view" id="viewMap">
      <div id="map"><div class="map-msg" id="mapMsg">지도를 불러오는 중…</div></div>
      <div class="map-filter hidden" id="mapFilter"></div>
      <button class="map-redo hidden" id="mapRedo" type="button">이 지역에서 다시 찾기</button>
      <div class="map-zoom"><button type="button" id="mapZin" aria-label="지도 확대">+</button><button type="button" id="mapZout" aria-label="지도 축소">−</button></div>
      <button class="map-fab" id="mapMe" type="button" aria-label="내 위치">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <div class="carousel" id="carousel"></div>
    </section>

    <!-- 매장 상세 -->
    <section class="view" id="viewStore"></section>

    <!-- 내 지갑 -->
    <section class="view" id="viewWallet"></section>
  </main>

  <nav class="tabbar" aria-label="메뉴">
    <div class="in">
      <button type="button" data-tab="list" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>주변 매장
      </button>
      <button type="button" data-tab="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>지도
      </button>
      <button type="button" data-tab="wallet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>내 지갑<span class="cnt hidden" id="walletCnt">0</span>
      </button>
    </div>
  </nav>

  <div class="dim hidden" id="dim"></div>
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast hidden" id="toast" role="status"></div>
  <noscript><p style="padding:20px">자바스크립트를 켜야 이용할 수 있어요.</p></noscript>
</body>
</html>
